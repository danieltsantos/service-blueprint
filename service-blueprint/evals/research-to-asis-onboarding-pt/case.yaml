schema_version: "1.1"
name: research-to-asis-onboarding-pt
expected_outcome: |
  An as-is blueprint in European Portuguese as frame YAML and card CSV (the spreadsheet). Cards from
  the interviews are evidence with sources. The AI-made summary is listed as ai-synthesis, and its
  unsupported claims (an average of 3 weeks, automatic CRM notification to Finance, mandatory training
  before first login) are not presented as evidence: they are left out, marked as assumptions, or
  flagged as contradicting the interviews. Failure points from the interviews (lost billing email,
  unreliable CRM email, no first-login check, support queue delay) appear as exceptions or friction.
context:
  scaffold_script: place-files.sh
