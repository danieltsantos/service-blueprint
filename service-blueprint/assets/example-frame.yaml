# Invented example: broadband installation for small businesses, with a proposed AI assistant step.
# It exists to show the format. None of its content is drawn from a real project.
title: Sample broadband blueprint
deliverable: L0 service blueprint for installing broadband at a small business site
owner: unassigned
last_updated: 2026-11-07
state: to-be
layer: L0
status: WIP
language: en
lane_policy: >
  The field technician works for a contractor but meets the customer on site, so the technician
  sits in a frontstage lane. Contractor dispatch, which the customer never sees, sits in a support lane.
attribution:
  author: Daniel Santos
  url: https://danieltsantos.com
  year: 2026
  licence: CC BY-NC 4.0
  licence_url: https://creativecommons.org/licenses/by-nc/4.0/
  note: Example made with the service-blueprint skill. Reuse with credit, not for commercial use.

header:
  - heading: Executive description
    items:
      - "Let small businesses order broadband online and get a working line on the first visit."
  - heading: Main goals
    items:
      - "Working line after the first technician visit"
      - "Customer always knows the next step and its date"
  - heading: Core user need
    items:
      - "I need to know when my line will work, so I can plan around the downtime."
  - heading: Key user stories
    items:
      - "As a shop owner, I want to pick an installation slot that fits my opening hours."
      - "As a shop owner, I want to hear early if the visit is at risk."
  - heading: Metrics to move
    items:
      - "% of installs working after the first visit"
      - "Contacts per order before the line goes live"

sources:
  - {id: S1, name: "Order flow specification", type: process, date: 2026-09}
  - {id: S2, name: "Customer interviews, round 1", type: primary, date: 2026-10}
  - {id: S3, name: "Kick-off summary made with an AI assistant", type: ai-synthesis, date: 2026-10}
  - {id: S4, name: "Product decision log", type: decision, date: 2026-10}

phases:
  - {id: "1", name: Order, subtitle: Customer orders online, cx: Orders and picks a slot, sla: "Slot offered at order time"}
  - {id: "2", name: Pre-install checks, subtitle: Line test and visit confirmation, cx: Visit confirmed, sla: "Confirmation at least 48 hours before the visit"}
  - {id: "3", name: Installation visit, subtitle: Technician installs on site, cx: Technician visits, sla: "Arrives within the booked window"}
  - {id: "4", name: Activation and first bill, subtitle: Line goes live, cx: Line works and the first bill arrives, sla: "Live within 1 business day of the visit"}

lanes:
  - {id: touch, name: "Customer messages", note: "Emails and texts", zone: evidence}
  - {id: customer, name: "Customer", note: "Shop owner", zone: customer}
  - {line: interaction}
  - {id: web, name: "Website and app", note: "What the customer sees", zone: frontstage}
  - {id: ai-front, name: "AI assistant", note: "In view of the customer", zone: frontstage}
  - {id: tech, name: "Field technician", note: "Contractor, on site", zone: frontstage}
  - {id: care, name: "Customer care", zone: frontstage}
  - {line: visibility}
  - {id: oms, name: "Order system", zone: backstage}
  - {id: ai-ops, name: "AI agent operations", note: "Guardrails and handoff", zone: backstage}
  - {line: internal}
  - {id: netops, name: "Network operations", zone: support}
  - {id: dispatch, name: "Contractor dispatch", zone: support}
  - {id: billing, name: "Billing", zone: support}
  - {id: docs, name: "Supporting documents", zone: artefacts}
  - {id: exc, name: "Exceptions & edge cases", zone: exceptions}

status_models:
  - name: Order status
    states:
      - {name: "Order received", set_by: "order created"}
      - {name: "Visit booked for {date}", set_by: "technician slot reserved"}
      - {name: "Visit confirmed", set_by: "line test passed"}
      - {name: "Installed", set_by: "line syncs on site"}
      - {name: "Live", set_by: "line activated"}
